[project]
name = "n8nview"
version = "0.1.0"
description = "Draw n8n workflows and their executions in the terminal"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = ["termaid>=0.12"]
keywords = ["n8n", "workflow", "mermaid", "terminal", "cli"]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]

[project.optional-dependencies]
color = ["termaid[rich]>=0.12"]

[project.scripts]
n8nview = "n8nview.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "termaid[rich]>=0.12.0",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
